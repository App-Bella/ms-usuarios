server:
  port: 8081

spring:
  application:
    name: ms-usuarios

  datasource:
    url: jdbc:postgresql://localhost:5432/pontebella_usuarios
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  security:
    bcrypt-strength: 12
  jwt:
    secret: pontebella-clave-secreta-compartida-con-el-gateway-cambiar-en-produccion
    expiration-ms: 3600000
